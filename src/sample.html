<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero to Sidebar Transition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background-color: #e5e5dc;
      color: #111;
      overflow-x: hidden;
    }

    /* Fixed Sidebar (target docking area) */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 260px;
      height: 100vh;
      background: #dfdfd6;
      border-right: 1px solid #ccc;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      opacity: 0; /* Hidden initially, fades in as hero collapses */
      pointer-events: none;
    }

    .sidebar.is-active {
      pointer-events: auto;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 40px;
    }

    .nav-badge {
      background: #ffeb3b;
      padding: 6px 12px;
      font-weight: 700;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
      font-size: 0.85rem;
    }

    /* Pinned Hero Viewport */
    .hero-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .hero-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Giant Background Brand Text */
    .brand-title {
      font-size: 16vw;
      font-weight: 900;
      color: #ebff00;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      line-height: 0.8;
      z-index: 1;
      will-change: transform, opacity;
    }

    /* Hero Center Card */
    .hero-center {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hero-heading {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      color: #111;
      margin-bottom: 20px;
      will-change: transform, opacity;
    }

    .cta-btn {
      background: #111;
      color: #fff;
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    /* Right-side content container that scrolls past */
    .main-content {
      position: relative;
      margin-left: 260px; /* Aligns with sidebar width */
      min-height: 100vh;
      padding: 80px 60px;
      z-index: 5;
      background-color: #e5e5dc;
    }

    .about-heading {
      font-size: 4rem;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .about-desc {
      font-size: 1.5rem;
      max-width: 650px;
      line-height: 1.5;
      color: #444;
    }
  </style>
</head>
<body>

  <!-- Sidebar (visible after hero collapses) -->
  <aside class="sidebar">
    <div>
      <div class="nav-badge">NESH®</div>
      <nav class="nav-links">
        <strong>HOME</strong>
        <span class="nav-badge">ABOUT ME</span>
        <span>PROJECTS</span>
        <span>SERVICES</span>
        <span>CLIENTS</span>
      </nav>
    </div>
    <button class="cta-btn" style="width: 100%;">Book a Call</button>
  </aside>

  <!-- Pinned Hero Transition Section -->
  <div class="hero-wrapper">
    <section class="hero-content">
      <div class="brand-title">NESH</div>
      <div class="hero-center">
        <h1 class="hero-heading">Webflow,<br>Applied Differently.</h1>
        <button class="cta-btn">Book a Call</button>
      </div>
    </section>
  </div>

  <!-- About Section -->
  <main class="main-content">
    <div class="nav-badge" style="margin-bottom: 16px;">START SMALL GROW BIG</div>
    <h2 class="about-heading">About Me (&)<br>My Journey</h2>
    <p class="about-desc">
      Seven years ago I opened Webflow for the first time. 
      What happened after that is easier to show than explain.
    </p>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".hero-wrapper",
        start: "top top",
        end: "+=120%",   // Pins the screen for 1.2 viewport heights of scrolling
        pin: true,
        scrub: 0.8,      // Ties animation directly to scroll position with slight smoothing
      }
    });

    // 1. Scale down and push the giant background text away
    tl.to(".brand-title", {
      scale: 0.3,
      x: "-40vw",
      y: "-30vh",
      opacity: 0,
      ease: "power2.inOut"
    }, 0);

    // 2. Shrink and fade the center hero elements
    tl.to(".hero-center", {
      scale: 0.6,
      opacity: 0,
      y: -50,
      ease: "power2.inOut"
    }, 0);

    // 3. Fade in the left-hand persistent sidebar simultaneously
    tl.to(".sidebar", {
      opacity: 1,
      ease: "power1.in",
      onUpdate: function() {
        const sidebar = document.querySelector('.sidebar');
        if (this.progress() > 0.5) {
          sidebar.classList.add('is-active');
        } else {
          sidebar.classList.remove('is-active');
        }
      }
    }, 0.2);
  </script>
</body>
</html>
